name: Tistory Blog Automation

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 KST 06:00 (UTC 21:00 전날)
  workflow_dispatch:         # 수동 실행 허용

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests feedparser googlenewsdecoder

      - name: Step 1 - Collect news
        run: python scripts/01_collect_news.py
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

      - name: Step 2 - Extract tech keywords & select topic
        run: python scripts/02_select_topic.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Step 3 - Generate blog po st
        run: python scripts/03_generate_post.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Step 5 - Update topic history
        run: python scripts/05_update_history.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/topic_history.json data/blog_post.html data/blog_post.json
          git diff --staged --quiet || git commit -m "chore: update topic history [skip ci]"
          git push
