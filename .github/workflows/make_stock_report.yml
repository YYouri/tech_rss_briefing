name: Market Report Auto Publisher

on:
  schedule:
    # UTC 21:30 = KST 06:30(연중 고정). 미국 정규장 마감은 서머타임(EDT) 기간엔
    # UTC 20:00, 표준시(EST) 기간엔 UTC 21:00이라, 예전 '55 20 * * 0-4'(UTC 20:55)는
    # EDT 기간엔 마감 55분 후로 괜찮았지만 EST 기간(11월 첫 일요일~3월 둘째 일요일)엔
    # 마감 5분 "전"에 실행되는 계절성 버그가 있었다. UTC 21:30은 EDT 기간엔 +90분,
    # EST 기간엔 +30분으로 연중 항상 마감 이후이면서 한국장 개장(09:00 KST) 전이다.
    - cron: '30 21 * * 0-4'   # 평일(월~금) KST 06:30 발행 — 연중 미국장 마감 이후 보장
  workflow_dispatch:
    inputs:
      dry_run:
        description: '발행 없이 HTML만 생성 (true/false)'
        required: false
        default: 'false'

jobs:
  market-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

#      - name: Check env vars
#       run: python scripts/debug-tokken.py
#        env:
#          BLOGGER_BLOG_ID:         ${{ secrets.BLOGGER_BLOG_ID }}
#          BLOGGER_CLIENT_ID:       ${{ secrets.BLOGGER_CLIENT_ID }}
#          BLOGGER_CLIENT_SECRET:   ${{ secrets.BLOGGER_CLIENT_SECRET }}
#          BLOGGER_REFRESH_TOKEN_2: ${{ secrets.BLOGGER_REFRESH_TOKEN_2 }}
          
      - name: Run market report
        run: python scripts/07_make_stock_report.py
        env:
          OPENROUTER_API_KEY:      ${{ secrets.OPENROUTER_API_KEY }}
          BLOGGER_BLOG_ID:         ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID:       ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET:   ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN_2: ${{ secrets.BLOGGER_REFRESH_TOKEN_2 }}
          DRY_RUN:                 ${{ github.event.inputs.dry_run || 'false' }}

      - name: Upload market report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_number }}
          path: data/market_*.json
          retention-days: 14

      - name: Commit market data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_*.json data/market_post_*.json data/market_result_*.json
          git diff --staged --quiet || git commit -m "chore: market-report $(date +'%Y-%m-%d') [skip ci]"
          git push
