name: Market Report Auto Publisher

on:
  schedule:
    # 미국 장 마감 후 KST 08:00 발행 (UTC 23:00 전날)
    # 나스닥 마감 ~05:00 KST → 08:00 발행으로 여유 확보
    - cron: '0 23 * * 1-5'   # 평일(월~금)만 실행
  workflow_dispatch:           # 수동 실행 허용
    inputs:
      dry_run:
        description: '발행 없이 HTML만 생성 (true/false)'
        required: false
        default: 'false'

jobs:
  market-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20        # 시세 수집 + LLM 여유 시간

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Run market report (collect + analyze + publish)
        run: python scripts/07_make_stock_report.py
        env:
          OPENROUTER_API_KEY:    ${{ secrets.OPENROUTER_API_KEY }}
          BLOGGER_BLOG_ID:       ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID:     ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN_2: ${{ secrets.BLOGGER_REFRESH_TOKEN_2 }}
          DRY_RUN:               ${{ github.event.inputs.dry_run || 'false' }}

      - name: Upload market report as artifact
        if: always()   # 실패해도 생성된 파일 보존
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_number }}
          path: |
            data/market_*.json
          retention-days: 14

      - name: Commit market data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_*.json data/market_post_*.json data/market_result_*.json
          git diff --staged --quiet || git commit -m "chore: market-report $(date +'%Y-%m-%d') [skip ci]"
          git push
